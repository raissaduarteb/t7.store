<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-id="{{ item.id }}" onClick="{{ onOpen }}" style="cursor:pointer;display:flex;flex-direction:column;gap:12px;min-width:0;width:100%;animation:t7fade .35s ease both;">
  <div style="position:relative;width:100%;aspect-ratio:311/356;background:var(--soft,#F4F2F3);overflow:hidden;border-radius:5px;">
    <img src="{{ item.img }}" alt="{{ item.nome }}" style="width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease;" style-hover="transform:scale(1.04);" />
    <sc-if value="{{ item.badgeShow }}" hint-placeholder-val="{{ true }}">
      <span style="position:absolute;left:0;top:14px;background:var(--accent,#E4B414);color:#2d2200;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;">{{ item.badge }}</span>
    </sc-if>
    <button data-id="{{ item.id }}" onClick="{{ onFav }}" aria-label="Favoritar" style="position:absolute;top:10px;right:10px;width:38px;height:38px;border:none;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.14);color:{{ item.heartColor }};transition:transform .15s;" style-hover="transform:scale(1.1);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </button>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;min-width:0;">
    <span style="display:block;width:100%;max-width:100%;font-size:15px;font-weight:500;color:var(--ink2,#2B2B2B);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ item.nome }}</span>
    <span style="font-size:11px;color:var(--muted,#8E8E8E);text-transform:uppercase;letter-spacing:.05em;">{{ item.tipoGen }}</span>
    <sc-if value="{{ mostrarPreco }}" hint-placeholder-val="{{ true }}">
      <span style="display:inline-flex;align-items:center;gap:9px;font-size:20px;font-weight:700;color:var(--ink,#121212);margin-top:2px;"><span style="width:12px;height:8px;background:var(--accent,#E4B414);display:inline-block;flex-shrink:0;"></span>{{ item.precoFmt }}</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:380},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;mostrarPreco&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e:any)=&gt;void&quot;},&quot;onFav&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e:any)=&gt;void&quot;}}"></script>
</body>
</html>
